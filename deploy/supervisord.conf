[unix_http_server]
file=/mnt/mydisk/xk/dh116/runs/services/supervisor.sock
chmod=0700

[supervisord]
logfile=/mnt/mydisk/xk/dh116/runs/services/supervisord.log
pidfile=/mnt/mydisk/xk/dh116/runs/services/supervisord.pid
childlogdir=/mnt/mydisk/xk/dh116/runs/services
logfile_maxbytes=10MB
logfile_backups=3

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///mnt/mydisk/xk/dh116/runs/services/supervisor.sock

[program:tensorboard]
command=/mnt/mydisk/xk/envs/dh116/bin/python -m tensorboard.main --logdir /mnt/mydisk/xk/dh116/runs/current --host 127.0.0.1 --port 6006 --reload_interval 5 --load_fast=false
directory=/mnt/mydisk/xk/dh116
environment=PYTHONUNBUFFERED="1",CUDA_VISIBLE_DEVICES="",OMP_NUM_THREADS="2",TF_CPP_MIN_LOG_LEVEL="2"
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/mnt/mydisk/xk/dh116/runs/services/tensorboard.log
stderr_logfile=/mnt/mydisk/xk/dh116/runs/services/tensorboard.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
