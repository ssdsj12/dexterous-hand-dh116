[unix_http_server]
file=/root/hand/runs/services/supervisor.sock
chmod=0700

[supervisord]
logfile=/root/hand/runs/services/supervisord.log
pidfile=/root/hand/runs/services/supervisord.pid
childlogdir=/root/hand/runs/services
logfile_maxbytes=10MB
logfile_backups=3

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/hand/runs/services/supervisor.sock

[program:tensorboard]
command=/opt/conda/envs/hand/bin/python -m tensorboard.main --logdir /root/hand/runs/current --host 127.0.0.1 --port 6006 --reload_interval 5 --load_fast=false
directory=/root/hand
environment=PYTHONUNBUFFERED="1",CUDA_VISIBLE_DEVICES="",OMP_NUM_THREADS="2",TF_CPP_MIN_LOG_LEVEL="2"
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/root/hand/runs/services/tensorboard.log
stderr_logfile=/root/hand/runs/services/tensorboard.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
